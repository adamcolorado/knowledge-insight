<!doctype html>
<!--
  Source for docs/assets/img/og-card.jpg, the 1200x630 social sharing card.
  Not part of the site. Rendered by tools/og-card.ps1, which screenshots this
  page with headless Edge and converts it to JPEG.

  The background is the licensed stock original in images/ (local only), so
  this renders only on a machine that has it. Edit the tagline below to match
  "tagline" in content/site.json.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #2f75b3; }
  .card {
    position: relative; width: 1200px; height: 630px;
    background: url("../images/knowledge-insight-background.jpg") 0 42% / cover no-repeat;
    font-family: "Montserrat", sans-serif; color: #fff;
  }
  .words {
    position: absolute; left: 440px; right: 30px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; text-shadow: 0 2px 14px rgba(10, 30, 60, .45);
  }
  .name { font-weight: 300; font-size: 112px; line-height: 1.02; letter-spacing: .02em; margin: 0; }
  .tagline { font-weight: 400; font-size: 34px; line-height: 1.3; letter-spacing: .03em; margin: 64px 0 0; max-width: 700px; }
</style>
</head>
<body>
<div class="card">
  <div class="words">
    <p class="name">Knowledge<br>InSight</p>
    <p class="tagline">We facilitate self-paced learning<br>for knowledge seekers.</p>
  </div>
</div>
</body>
</html>
